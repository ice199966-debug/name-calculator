<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>三才五格 · 納音五行</title>
    <script src="kangxi-data.js"></script>
    <script src="chaizi-data.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            font-family: 'PingFang TC', 'Helvetica Neue', sans-serif;
            background: #f5efe9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        .app {
            max-width: 520px;
            width: 100%;
            background: #fffcf8;
            border-radius: 36px 36px 28px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            padding: 24px 20px 28px;
            position: relative;
            overflow: hidden;
        }
        .app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, #b8860b, #daa520, #b8860b);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #3e2c1b;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8b5a2b, #c68e47);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { font-size: 13px; color: #a0806a; letter-spacing: 1px; margin-top: 2px; }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .input-group .field {
            flex: 1;
            min-width: 80px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #5a4030;
            margin-bottom: 2px;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            font-size: 18px;
            border: 2px solid #e8ddd2;
            border-radius: 12px;
            background: #fefcf9;
            color: #2c1f14;
            outline: none;
            transition: 0.2s;
            font-weight: 500;
        }
        .field input:focus {
            border-color: #c68e47;
            box-shadow: 0 0 0 4px rgba(198,142,71,0.15);
        }
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a67c4e, #8b5a2b);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 16px rgba(139,90,43,0.3);
        }
        .btn-calc:active { transform: scale(0.97); }

        .error-box {
            background: #fff0ec;
            border-left: 5px solid #c0392b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 14px;
            color: #a93226;
            font-size: 14px;
            display: none;
        }
        .error-box.show { display: block; }
        .manual-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .manual-row input { width: 70px; padding: 6px; font-size: 16px; border: 1px solid #d5b8a8; border-radius: 8px; text-align: center; }
        .manual-row button { background: #8b5a2b; color: white; border: none; padding: 6px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; }

        .result-area { margin-top: 22px; display: none; }
        .result-area.show { display: block; }

        .grid-cross {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto auto auto;
            gap: 8px;
            margin-bottom: 18px;
        }
        .grid-cross .cell {
            background: #fcf8f4;
            border-radius: 16px;
            padding: 10px 4px;
            text-align: center;
            border: 1px solid #eee5dd;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .cell .label {
            font-size: 13px;
            color: #a0806a;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .cell .number {
            font-size: 28px;
            font-weight: 800;
            color: #3e2c1b;
            line-height: 1.2;
        }
        .cell .number.empty {
            color: #ccc;
            font-weight: 400;
        }
        .cell .wuxing {
            font-size: 15px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 2px;
        }
        .wx-mu { color: #2d7d46; background: #e4f0e8; }
        .wx-huo { color: #c0392b; background: #fae9e7; }
        .wx-tu { color: #b9772b; background: #f5ede4; }
        .wx-jin { color: #a6876b; background: #f3ede8; }
        .wx-shui { color: #2c6e8f; background: #e3edf2; }

        .cell-tian { grid-column: 2; grid-row: 1; }
        .cell-ren { grid-column: 2; grid-row: 2; background: #f4ede6; border-color: #c6b09a; }
        .cell-di  { grid-column: 2; grid-row: 3; }
        .cell-zong{ grid-column: 2; grid-row: 4; }
        .cell-wai { grid-column: 1; grid-row: 2; }

        /* 納音：放在第1列(天格列)，對齊底部，再往下推自身一半高度
           使中心精準落在天格與人格的交界線上（兩格中線） */
        .cell-nayin {
            grid-column: 3;
            grid-row: 1;
            align-self: end;
            -webkit-transform: translateY(50%);
            transform: translateY(50%);
            position: relative;
            z-index: 2;
        }

        /* 拆字五行顯示格：字體與其他格五行文字完全一致 */
        .cell-custom {
            grid-column: 1;
            grid-row: 3;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fcf8f4;
            border-radius: 16px;
            border: 1px solid #eee5dd;
            overflow: visible;
        }
        .cell-custom textarea {
            width: 100%;
            height: 68px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.6;
            text-align: center;
            font-family: inherit;
            color: #3e2c1b;
            border: none;
            background: transparent;
            outline: none;
            padding: 0 !important;
            margin: 0 !important;
            resize: none;
            overflow: hidden;
            white-space: pre;
            letter-spacing: 0;
            display: block;
            -webkit-appearance: none;
            appearance: none;
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            cursor: default;
        }
        .cell-custom textarea:focus {
            background: transparent;
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            background: #f5ede4;
            border-radius: 20px;
            padding: 12px 16px;
            border: 1px solid #e0cfc0;
            margin-top: 6px;
        }
        .info-item {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }
        .info-item .tag {
            font-size: 12px;
            color: #8b7355;
            letter-spacing: 1px;
        }
        .info-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #3e2c1b;
            margin-top: 2px;
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #c2b2a2;
            text-align: center;
            border-top: 1px dashed #e8ddd2;
            padding-top: 14px;
        }

        /* 平板 / 大手機 */
        @media (max-width: 480px) {
            .app { padding: 16px 12px; }
            .grid-cross { gap: 5px; }
            .cell .number { font-size: 22px; }
            .cell { min-height: 60px; padding: 6px 2px; }
            .info-item .value { font-size: 17px; }
            .header h1 { font-size: 20px; }
            .btn-calc { font-size: 16px; padding: 12px; }

            .cell .wuxing {
                font-size: 15px;
                font-weight: 600;
                padding: 2px 6px;
            }
            .cell-custom textarea {
                height: 72px;
                font-size: 15px;
                font-weight: 600;
                line-height: 1.6;
            }
        }

        /* 小手機 */
        @media (max-width: 380px) {
            .grid-cross { gap: 4px; }
            .cell .number { font-size: 18px; }

            .cell .wuxing {
                font-size: 15px;
                font-weight: 600;
            }
            .cell-custom textarea {
                height: 68px;
                font-size: 15px;
                font-weight: 600;
                line-height: 1.6;
            }
        }

        /* 超小手機 */
        @media (max-width: 340px) {
            .cell-custom textarea {
                height: 64px;
                font-size: 15px;
                font-weight: 600;
                line-height: 1.6;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>三才五格 · 納音</h1>
        <p>康熙筆畫 · 出生年納音五行</p>
    </div>

    <div class="input-group">
        <div class="field">
            <label>姓</label>
            <input type="text" id="surname" placeholder="王" value="" maxlength="6">
        </div>
        <div class="field">
            <label>名</label>
            <input type="text" id="givenName" placeholder="小明" value="" maxlength="6">
        </div>
        <div class="field" style="flex:0.8; min-width:80px;">
            <label>出生年</label>
            <input type="number" id="birthYear" placeholder="" value="" min="1900" max="2100">
        </div>
    </div>

    <button class="btn-calc" id="calcBtn">開始計算</button>

    <div class="error-box" id="errorBox">
        <div id="errorMessage"></div>
    </div>

    <div class="result-area" id="resultArea">
        <div class="grid-cross">
            <div class="cell cell-tian">
                <div class="label">天格</div>
                <div class="number" id="rTian">-</div>
                <div class="wuxing" id="rTianWx">-</div>
            </div>
            <div class="cell cell-ren">
                <div class="label">人格</div>
                <div class="number" id="rRen">-</div>
                <div class="wuxing" id="rRenWx">-</div>
            </div>
            <div class="cell cell-di">
                <div class="label">地格</div>
                <div class="number" id="rDi">-</div>
                <div class="wuxing" id="rDiWx">-</div>
            </div>
            <div class="cell cell-zong">
                <div class="label">總格</div>
                <div class="number" id="rZong">-</div>
                <div class="wuxing" id="rZongWx">-</div>
            </div>
            <div class="cell cell-wai">
                <div class="label">外格</div>
                <div class="number" id="rWai">-</div>
                <div class="wuxing" id="rWaiWx">-</div>
            </div>
            <div class="cell cell-nayin">
                <div class="label">納音五行</div>
                <div class="number" id="rNayinName" style="font-size:22px;">-</div>
                <div class="wuxing" id="rNayinWx">-</div>
            </div>
            <div class="cell cell-custom">
                <textarea id="customChar" readonly wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
            </div>
        </div>

        <div class="info-row">
            <div class="info-item">
                <div class="tag">三才配置</div>
                <div class="value" id="sancaiDisplay"></div>
            </div>
            <div class="info-item">
                <div class="tag">出生年</div>
                <div class="value" id="yearDisplay">-</div>
            </div>
        </div>

        <div class="footer-note">※ 若遇罕見字，請依提示補填筆畫</div>
    </div>
</div>

<script>
// ============================================================
//  1. 載入外部資料庫
// ============================================================
let STROKE_MAP = window.KANGXI_DATA || {};
const CHAIZI_WUXING = window.CHAIZI_WUXING || {};

// ============================================================
//  2. 拆字五行查詢
// ============================================================
function getCharWuxing(ch) {
    if (!ch) return '';
    return CHAIZI_WUXING[ch] || '';
}

// ============================================================
//  3. 納音五行
// ============================================================
const NAYIN_LIST = [
    '海中金', '爐中火', '大林木', '路旁土', '劍鋒金', '山頭火',
    '澗下水', '城頭土', '白蠟金', '楊柳木', '泉中水', '屋上土',
    '霹靂火', '松柏木', '長流水', '沙中金', '山下火', '平地木',
    '壁上土', '金箔金', '覆燈火', '天河水', '大驛土', '釵釧金',
    '桑柘木', '大溪水', '沙中土', '天上火', '石榴木', '大海水'
];

function getSexagenaryOrder(heavenlyIdx, earthlyIdx) {
    for (let i = 0; i < 60; i++) {
        if (i % 10 === heavenlyIdx && i % 12 === earthlyIdx) return i;
    }
    return -1;
}

function getNayin(year) {
    const stemIdx = (year - 4) % 10;
    const branchIdx = (year - 4) % 12;
    const order = getSexagenaryOrder(stemIdx, branchIdx);
    if (order === -1) return { name: '未知', wuxing: '?' };
    const nayinName = NAYIN_LIST[Math.floor(order / 2)];
    let wuxing = '';
    for (let key of ['金','木','水','火','土']) {
        if (nayinName.includes(key)) { wuxing = key; break; }
    }
    return { name: nayinName, wuxing: wuxing };
}

// ============================================================
//  4. 五格計算
// ============================================================
function getStroke(char) {
    return STROKE_MAP[char] !== undefined ? STROKE_MAP[char] : null;
}

function sumStrokes(str) {
    let total = 0, missing = [];
    for (let ch of str) {
        const s = getStroke(ch);
        if (s === null) missing.push(ch);
        else total += s;
    }
    return { total, missing };
}

function getWuXing(num) {
    const last = num % 10;
    if (last === 1 || last === 2) return { name: '木', cls: 'wx-mu' };
    if (last === 3 || last === 4) return { name: '火', cls: 'wx-huo' };
    if (last === 5 || last === 6) return { name: '土', cls: 'wx-tu' };
    if (last === 7 || last === 8) return { name: '金', cls: 'wx-jin' };
    if (last === 9 || last === 0) return { name: '水', cls: 'wx-shui' };
    return { name: '?', cls: '' };
}

function calculateName(surname, givenName) {
    surname = surname.trim();
    givenName = givenName.trim();
    if (!surname) return { error: '請輸入姓氏' };
    if (!givenName) return { error: '請輸入名字' };

    const sChars = [...surname];
    const gChars = [...givenName];
    const sResult = sumStrokes(surname);
    const gResult = sumStrokes(givenName);
    const allMissing = [...sResult.missing, ...gResult.missing];
    if (allMissing.length > 0) {
        return { error: '缺字', missing: allMissing, detail: `以下字尚未收錄：${allMissing.join('、')}，請手動輸入筆畫` };
    }

    const 天格文字 = sResult.total;
    const 人格文字 = gChars.length > 0 ? getStroke(gChars[0]) : 0;
    const 地格文字 = gChars.length > 1 ? getStroke(gChars[1]) : 0;

    const isSingleName = gChars.length === 1;

    const 天格数字 = 天格文字;
    const 人格数字 = 人格文字;
    const 地格数字 = isSingleName ? null : 地格文字;
    const 外格数字 = isSingleName ? 1 : 地格文字 + 1;
    const 總格数字 = 天格文字 + gResult.total;

    const 天格五行 = getWuXing(天格文字 + 1);
    const 人格五行 = getWuXing(天格文字 + 人格文字);

    let 地格五行;
    if (isSingleName) {
        地格五行 = getWuXing(人格文字 + 1);
    } else {
        地格五行 = getWuXing(人格文字 + 地格文字);
    }

    let 外格五行;
    if (isSingleName) {
        外格五行 = getWuXing(1);
    } else {
        外格五行 = getWuXing(地格文字 + 1);
    }

    let 總格五行;
    if (isSingleName) {
        總格五行 = getWuXing(天格文字 + 人格文字);
    } else {
        總格五行 = getWuXing(天格文字 + 人格文字 + 地格文字);
    }

    return {
        天格: 天格数字,
        人格: 人格数字,
        地格: 地格数字,
        總格: 總格数字,
        外格: 外格数字,
        天格五行, 人格五行, 地格五行, 總格五行, 外格五行,
        isSingleName
    };
}

// ============================================================
//  5. UI 渲染
// ============================================================
let pendingMissing = null;

function renderResult(data, birthYear) {
    const area = document.getElementById('resultArea');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMessage');

    area.classList.remove('show');
    errorBox.classList.remove('show');

    if (!data) {
        errorBox.classList.add('show');
        errorMsg.innerHTML = '⚠️ 計算結果為空，請檢查輸入。';
        return;
    }

    if (data.error === '缺字') {
        errorBox.classList.add('show');
        pendingMissing = data.missing;
        let html = `<div>⚠️ <strong>${data.detail}</strong></div><div class="manual-row">`;
        data.missing.forEach((ch, idx) => {
            html += `
                <span style="display:flex;align-items:center;gap:4px;background:#faf0ea;padding:4px 10px;border-radius:30px;">
                    <strong style="font-size:20px;">${ch}</strong>
                    <input type="number" id="manual_${idx}" min="1" max="50" placeholder="筆畫" style="width:60px;padding:6px;border-radius:8px;border:1px solid #d5b8a8;text-align:center;font-size:16px;">
                </span>
            `;
        });
        html += `<button onclick="retryWithManual()" style="background:#8b5a2b;color:white;border:none;padding:6px 18px;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;">重新計算</button></div>`;
        errorMsg.innerHTML = html;
        return;
    }

    if (data.error) {
        errorBox.classList.add('show');
        errorMsg.innerHTML = `⚠️ ${data.error}`;
        return;
    }

    area.classList.add('show');

    const map = {
        'rTian': { val: data.天格, wx: data.天格五行 },
        'rRen': { val: data.人格, wx: data.人格五行 },
        'rDi': { val: data.地格, wx: data.地格五行 },
        'rZong': { val: data.總格, wx: data.總格五行 },
        'rWai': { val: data.外格, wx: data.外格五行 }
    };

    for (let [id, obj] of Object.entries(map)) {
        const el = document.getElementById(id);
        const wxEl = document.getElementById(id + 'Wx');

        if (id === 'rDi' && data.isSingleName) {
            if (el) { el.textContent = '－'; el.className = 'number empty'; }
        } else {
            if (el) { el.textContent = obj.val !== null && obj.val !== undefined ? obj.val : '－'; el.className = 'number'; }
        }

        if (wxEl && obj.wx) {
            wxEl.textContent = obj.wx.name;
            wxEl.className = `wuxing ${obj.wx.cls}`;
        } else if (wxEl) {
            wxEl.textContent = '-';
            wxEl.className = 'wuxing';
        }
    }

    if (birthYear) {
        const year = parseInt(birthYear);
        if (!isNaN(year) && year > 0) {
            const nayin = getNayin(year);
            document.getElementById('rNayinName').textContent = nayin.name;
            const wxEl = document.getElementById('rNayinWx');
            const clsMap = { '金': 'wx-jin','木':'wx-mu','水':'wx-shui','火':'wx-huo','土':'wx-tu' };
            wxEl.textContent = nayin.wuxing || '?';
            wxEl.className = `wuxing ${clsMap[nayin.wuxing] || ''}`;
            document.getElementById('yearDisplay').textContent = year;
        } else {
            document.getElementById('rNayinName').textContent = '無效';
            document.getElementById('rNayinWx').textContent = '-';
            document.getElementById('rNayinWx').className = 'wuxing';
            document.getElementById('yearDisplay').textContent = '無效';
        }
    } else {
        document.getElementById('rNayinName').textContent = '-';
        document.getElementById('rNayinWx').textContent = '-';
        document.getElementById('rNayinWx').className = 'wuxing';
        document.getElementById('yearDisplay').textContent = '-';
    }

    const tian = data.天格五行;
    const ren = data.人格五行;
    const di = data.地格五行;
    document.getElementById('sancaiDisplay').innerHTML = 
        `<span style="color:#2d7d46;">${tian.name}</span> 
         <span style="color:#a0806a;">·</span> 
         <span style="color:#c0392b;">${ren.name}</span> 
         <span style="color:#a0806a;">·</span> 
         <span style="color:#b9772b;">${di.name}</span>`;
}

// ============================================================
//  6. 格式化：強制前 2 後 3
// ============================================================
function formatWuxing(str) {
    if (!str) return '';
    let cleaned = str.replace(/[\s\n\r]/g, '');
    cleaned = cleaned.replace(/[^金木水火土]/g, '');
    if (cleaned.length > 5) cleaned = cleaned.slice(0, 5);
    if (cleaned.length > 2) {
        return cleaned.slice(0, 2) + '\n' + cleaned.slice(2);
    }
    return cleaned;
}

// 依「名字最後一個字」自動填入拆字五行，查無資料則顯示空白
function autoFillCustomWuxing() {
    const input = document.getElementById('customChar');
    if (!input) return;

    const givenName = document.getElementById('givenName').value.trim();
    if (!givenName) {
        input.value = '';
        return;
    }

    const chars = [...givenName];
    const lastChar = chars[chars.length - 1];
    input.value = formatWuxing(getCharWuxing(lastChar));
}

// ============================================================
//  7. 互動
// ============================================================
function calculate() {
    try {
        const surname = document.getElementById('surname').value;
        const givenName = document.getElementById('givenName').value;
        const birthYear = document.getElementById('birthYear').value;
        const result = calculateName(surname, givenName);
        renderResult(result, birthYear);

        if (!result || !result.error) {
            autoFillCustomWuxing();
        }
    } catch (e) {
        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMessage');
        errorBox.classList.add('show');
        errorMsg.innerHTML = `⚠️ 系統錯誤：${e.message || '請檢查輸入'}`;
        document.getElementById('resultArea').classList.remove('show');
        console.error(e);
    }
}

function retryWithManual() {
    try {
        const surname = document.getElementById('surname').value.trim();
        const givenName = document.getElementById('givenName').value.trim();
        const birthYear = document.getElementById('birthYear').value;
        if (!surname || !givenName) { alert('請完整輸入姓名'); return; }
        if (!pendingMissing || pendingMissing.length === 0) { calculate(); return; }

        const manualMap = {};
        for (let i = 0; i < pendingMissing.length; i++) {
            const input = document.getElementById(`manual_${i}`);
            if (!input) continue;
            const val = parseInt(input.value);
            if (isNaN(val) || val <= 0) { alert(`請為「${pendingMissing[i]}」填入有效的筆畫數字`); return; }
            manualMap[pendingMissing[i]] = val;
        }

        const tempMap = { ...STROKE_MAP };
        for (let [ch, stroke] of Object.entries(manualMap)) { tempMap[ch] = stroke; }

        const originalGetStroke = window.getStroke;
        window.getStroke = function(char) { return tempMap[char] !== undefined ? tempMap[char] : null; };
        const result = calculateName(surname, givenName);
        window.getStroke = originalGetStroke;

        if (result && result.error === '缺字') { renderResult(result, birthYear); }
        else { renderResult(result, birthYear); pendingMissing = null; autoFillCustomWuxing(); }
    } catch (e) {
        alert('補填筆畫時發生錯誤：' + e.message);
        console.error(e);
    }
}

// ============================================================
//  8. 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('calcBtn').addEventListener('click', calculate);

    // 顯示格為唯讀，內容由名字最後一個字的拆字五行決定
    const customInput = document.getElementById('customChar');
    if (customInput) {
        customInput.setAttribute('readonly', 'readonly');
    }

    calculate();
});
</script>
